name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: touhou-maid-affection
          path: build/libs/touhou-maid-affection-*.jar
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要完整历史与 tags 来定位「上一个已发布版本」；
          # 不能用 fetch-tags: true——tag 触发时它会尝试同时 fetch commit 与 tag 到同一 ref，git 报 exit 128。
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/touhou-maid-affection-*.jar
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Extract changelog
        id: changelog
        shell: bash
        run: |
          CUR="${GITHUB_REF_NAME#v}"; CUR="${CUR%-forge1.20.1}"
          PREV_TAG="$( (git tag --sort=-v:refname 2>/dev/null || true) | grep -v -F "$GITHUB_REF_NAME" | head -n1 || true)"
          PREV="${PREV_TAG#v}"; PREV="${PREV%-forge1.20.1}"
          BODY="$(awk -v cur="$CUR" -v prev="$PREV" '
              index($0, "## [" cur "]") == 1 { p = 1 }
              p && prev != "" && index($0, "## [" prev "]") == 1 { exit }
              p { print }
            ' CHANGELOG.md 2>/dev/null || true)"
          if [ -z "$BODY" ]; then
            BODY="Release ${GITHUB_REF_NAME}. See CHANGELOG.md in the repository."
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Extracted changelog for $CUR (previous tag: ${PREV_TAG:-none}, $(echo "$BODY" | wc -l) lines)"
        continue-on-error: true

      - name: Publish to Modrinth
        if: ${{ env.MODRINTH_TOKEN != '' }}
        run: |
          chmod +x ./gradlew
          ./gradlew modrinth
        env:
          CHANGELOG: ${{ steps.changelog.outputs.body }}

      - name: Resolve release jar
        id: release_jar
        shell: bash
        run: |
          JAR_PATH=$(ls build/libs/touhou-maid-affection-*.jar | grep -v '\-sources\.jar' | head -n 1)
          if [ -z "$JAR_PATH" ]; then
            echo "No release jar found in build/libs"
            exit 1
          fi
          echo "jar_path=$JAR_PATH" >> "$GITHUB_OUTPUT"
          echo "Resolved jar: $JAR_PATH"

      - name: Publish to CurseForge
        if: ${{ env.CURSEFORGE_TOKEN != '' && vars.CURSEFORGE_PROJECT_ID != '' }}
        uses: itsmeow/curseforge-upload@v3
        with:
          token: ${{ env.CURSEFORGE_TOKEN }}
          project_id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          game_endpoint: minecraft
          file_path: ${{ steps.release_jar.outputs.jar_path }}
          game_versions: "Minecraft 1.21:1.21.1,Java 21,NeoForge"
          changelog: |
            ${{ steps.changelog.outputs.body }}
