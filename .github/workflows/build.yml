name: Build & Release

on:
  push:
    branches: [ main, forge-1.20.1 ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, forge-1.20.1 ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ (github.ref_name == 'forge-1.20.1' || contains(github.ref_name, 'forge1.20.1')) && '17' || '21' }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: touhou-maid-affection-${{ github.ref_name }}
          path: build/libs/touhou-maid-affection-*.jar
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要完整历史与 tags 来定位「上一个已发布版本」；
          # 不能用 fetch-tags: true——tag 触发时它会尝试同时 fetch commit 与 tag 到同一 ref，git 报 exit 128。
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ (github.ref_name == 'forge-1.20.1' || contains(github.ref_name, 'forge1.20.1')) && '17' || '21' }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/touhou-maid-affection-*.jar
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Extract changelog
        id: changelog
        shell: bash
        run: |
          CUR="${GITHUB_REF_NAME#v}"; CUR="${CUR%-forge1.20.1}"
          # 取「严格小于当前版本」的最大已发布版本：必须按版本号比较并剥离 -forge1.20.1 后缀，
          # 否则跨加载器的 tag（例如刚推的 v1.7.5.0）会被误选为“上一个版本”而把正文截空。
          PREV="$( (git tag 2>/dev/null || true) \
            | sed 's/^v//; s/-forge1\.20\.1$//' \
            | sort -uV \
            | awk -v cur="$CUR" '$0 < cur' \
            | tail -n1 )"
          BODY="$(awk -v cur="$CUR" -v prev="$PREV" '
              index($0, "## [" cur "]") == 1 { p = 1 }
              p && prev != "" && index($0, "## [" prev "]") == 1 { exit }
              p { print }
            ' CHANGELOG.md 2>/dev/null || true)"
          if [ -z "$BODY" ]; then
            BODY="Release ${GITHUB_REF_NAME}. See CHANGELOG.md in the repository."
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Extracted changelog for $CUR (previous version: ${PREV:-none}, $(echo "$BODY" | wc -l) lines)"
        continue-on-error: true

      - name: Publish to Modrinth
        id: modrinth
        if: env.MODRINTH_TOKEN != ''
        env:
          CHANGELOG: ${{ steps.changelog.outputs.body }}
        run: |
          PROJECT_ID="$(grep -E '^modrinth_project_id=' gradle.properties | cut -d= -f2)"
          VERSION="$(grep -E '^mod_version=' gradle.properties | cut -d= -f2)+forge1.20.1"
          # 零依赖幂等判断：直接问 API「这个版本号是否存在」看状态码。
          # 不要用 jq / python3 解析列表——它们在某些环境下会静默失败，判空即走上传分支，
          # 会像 1.7.5.0 那样在 Modrinth 上产生同版本号的重复条目。
          ENCODED="$(printf '%s' "$VERSION" | sed 's/+/%2B/g')"
          CODE="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: $MODRINTH_TOKEN" \
            "https://api.modrinth.com/v2/project/$PROJECT_ID/version/$ENCODED" || echo 000)"
          echo "Modrinth $VERSION 查询结果: HTTP $CODE"
          if [ "$CODE" = "200" ]; then
            echo "Modrinth 已有 $VERSION，跳过发布（更新说明可在网页端修改）"
          else
            ./gradlew modrinth
          fi

      - name: Resolve Forge release jar
        id: forge_jar
        if: contains(github.ref_name, 'forge1.20.1')
        run: |
          JAR_PATH="$(find build/libs -maxdepth 1 -type f -name 'touhou-maid-affection-*.jar' ! -name '*-sources.jar' | head -n 1)"
          if [ -z "$JAR_PATH" ]; then
            echo "No Forge release jar found."
            exit 1
          fi
          echo "path=$JAR_PATH" >> "$GITHUB_OUTPUT"

      - name: Check CurseForge existing file
        id: cfcheck
        shell: bash
        if: contains(github.ref_name, 'forge1.20.1') && env.CURSEFORGE_TOKEN != '' && vars.CURSEFORGE_PROJECT_ID != ''
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          JAR_NAME="$(basename '${{ steps.forge_jar.outputs.path }}')"
          EXISTING="$(curl -sS -H "x-api-key: $CURSEFORGE_TOKEN" \
            "https://api.curseforge.com/v1/mods/${{ vars.CURSEFORGE_PROJECT_ID }}/files?pageSize=50" \
            | jq -r --arg n "$JAR_NAME" '.data[]? | select((.fileName // .displayName // .name) == $n) | .id' | head -n1)"
          if [ -n "$EXISTING" ]; then
            echo "CurseForge 已有 $JAR_NAME（id=$EXISTING），跳过上传"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to CurseForge
        if: steps.cfcheck.outputs.skip != 'true' && contains(github.ref_name, 'forge1.20.1') && env.CURSEFORGE_TOKEN != '' && vars.CURSEFORGE_PROJECT_ID != ''
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          files: ${{ steps.forge_jar.outputs.path }}
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
          loaders: forge
          game-versions: 1.20.1
          version: ${{ github.ref_name }}
          version-type: release
          changelog: |
            ${{ steps.changelog.outputs.body }}
