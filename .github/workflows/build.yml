name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: touhou-maid-affection
          path: build/libs/touhou-maid-affection-*.jar
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要完整历史与 tags 来定位「上一个已发布版本」；
          # 不能用 fetch-tags: true——tag 触发时它会尝试同时 fetch commit 与 tag 到同一 ref，git 报 exit 128。
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/touhou-maid-affection-*.jar
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Extract changelog
        id: changelog
        shell: bash
        run: |
          CUR="${GITHUB_REF_NAME#v}"; CUR="${CUR%-forge1.20.1}"
          # 取「严格小于当前版本」的最大已发布版本：必须按版本号比较并剥离 -forge1.20.1 后缀，
          # 否则跨加载器的 tag（例如刚推的 v1.7.5.0）会被误选为“上一个版本”而把正文截空。
          PREV="$( (git tag 2>/dev/null || true) \
            | sed 's/^v//; s/-forge1\.20\.1$//' \
            | sort -uV \
            | awk -v cur="$CUR" '$0 < cur' \
            | tail -n1 )"
          BODY="$(awk -v cur="$CUR" -v prev="$PREV" '
              index($0, "## [" cur "]") == 1 { p = 1 }
              p && prev != "" && index($0, "## [" prev "]") == 1 { exit }
              p { print }
            ' CHANGELOG.md 2>/dev/null || true)"
          if [ -z "$BODY" ]; then
            BODY="Release ${GITHUB_REF_NAME}. See CHANGELOG.md in the repository."
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Extracted changelog for $CUR (previous version: ${PREV:-none}, $(echo "$BODY" | wc -l) lines)"
        continue-on-error: true

      - name: Publish to Modrinth
        id: modrinth
        if: env.MODRINTH_TOKEN != ''
        env:
          CHANGELOG: ${{ steps.changelog.outputs.body }}
        run: |
          PROJECT_ID="$(grep -E '^modrinth_project_id=' gradle.properties | cut -d= -f2)"
          VERSION="$(grep -E '^mod_version=' gradle.properties | cut -d= -f2)"
          EXISTING="$(curl -s -H "Authorization: $MODRINTH_TOKEN" \
            "https://api.modrinth.com/v2/project/$PROJECT_ID/version" \
            | jq -r --arg v "$VERSION" '.[] | select(.version_number == $v) | .id' | head -n1)"
          if [ -n "$EXISTING" ]; then
            echo "Modrinth 已有 $VERSION（id=$EXISTING），仅更新更新说明"
            jq -n --arg cl "$CHANGELOG" '{changelog: $cl}' > /tmp/modrinth-patch.json
            curl -sS -X PATCH -H "Authorization: $MODRINTH_TOKEN" -H "Content-Type: application/json" \
              -d @/tmp/modrinth-patch.json "https://api.modrinth.com/v2/version/$EXISTING" > /dev/null
          else
            ./gradlew modrinth
          fi

      - name: Resolve release jar
        id: release_jar
        shell: bash
        run: |
          JAR_PATH="$(find build/libs -maxdepth 1 -type f -name 'touhou-maid-affection-*.jar' ! -name '*-sources.jar' | head -n 1)"
          if [ -z "$JAR_PATH" ]; then
            echo "No release jar found in build/libs"
            exit 1
          fi
          echo "jar_path=$JAR_PATH" >> "$GITHUB_OUTPUT"
          echo "Resolved jar: $JAR_PATH"

      - name: Publish to CurseForge
        if: ${{ env.CURSEFORGE_TOKEN != '' && vars.CURSEFORGE_PROJECT_ID != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          files: ${{ steps.release_jar.outputs.jar_path }}
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
          loaders: neoforge
          game-versions: 1.21.1
          version: ${{ github.ref_name }}
          version-type: release
          changelog: |
            ${{ steps.changelog.outputs.body }}
